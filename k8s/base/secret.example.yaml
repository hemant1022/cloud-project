# Example only — do NOT apply with real values and do NOT commit a filled copy.
#
# Create the real secret with:
#   kubectl -n inventory create secret generic inventory-secrets \
#     --from-literal=POSTGRES_PASSWORD='<password>' \
#     --from-literal=DATABASE_URL='postgresql+psycopg2://inventory:<password>@db:5432/inventory' \
#     --from-literal=JWT_SECRET='<long-random-string>' \
#     --from-literal=ADMIN_EMAIL='admin@example.com' \
#     --from-literal=ADMIN_PASSWORD='<strong-password>'
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
  labels:
    app.kubernetes.io/part-of: inventory
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+psycopg2://inventory:change-me@db:5432/inventory
  JWT_SECRET: change-me
  ADMIN_EMAIL: admin@inventory.local
  ADMIN_PASSWORD: change-me-admin
