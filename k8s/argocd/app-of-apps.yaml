apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hemant1022/cloud-project.git
    targetRevision: main
    path: k8s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
