apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inventory

resources:
  - ../../base

images:
  - name: inventory-backend
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/ECR_REPOSITORY
    newTag: backend-latest
  - name: inventory-frontend
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/ECR_REPOSITORY
    newTag: frontend-latest
replicas:
  - name: backend
    count: 3
  - name: frontend
    count: 3

configMapGenerator:
  - name: inventory-db-init
    files:
      - ../../../app/db/init.sql
      - ../../../app/db/seed/categories.csv
      - ../../../app/db/seed/suppliers.csv
      - ../../../app/db/seed/products.csv
