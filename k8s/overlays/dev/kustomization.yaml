apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inventory

resources:
  - ../../base

images:
  - name: inventory-backend
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/inventory-backend
    newTag: latest
  - name: inventory-frontend
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/inventory-frontend
    newTag: latest
  - name: inventory-db
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/inventory-db
    newTag: latest

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2
