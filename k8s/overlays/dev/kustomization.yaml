apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inventory

resources:
- ../../base

images:
- name: inventory-backend
  newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/ECR_REPOSITORY
  newTag: backend-latest
- name: inventory-db
  newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/ECR_REPOSITORY
  newTag: db-latest
- name: inventory-frontend
  newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/ECR_REPOSITORY
  newTag: frontend-latest

replicas:
- count: 2
  name: backend
- count: 2
  name: frontend
