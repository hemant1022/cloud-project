name: inventory

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../app/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../app/db/seed:/docker-entrypoint-initdb.d/seed:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-inventory}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../app/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD:-inventory}@db:5432/${POSTGRES_DB:-inventory}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@inventory.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      LOG_STACK: backend
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      PROJECT_ROOT: /app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../app/frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
